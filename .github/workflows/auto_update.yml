name: Auto update

on:
  schedule:
    # Executed at 5:00, 13:00, 21:00 o'clock every day
    # 表达式生成  https://crontab.guru/
    - cron: "0 5,13,21 * * *"

  workflow_dispatch:

jobs:
  auto_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.10"
      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/run_in_Actions/requirements') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Timezone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'
      - name: Requirements
        run: |
          pip install -r ./utils/requirements
      - name: SubMerge
        run: |
          if [ ! -f "./subconverter/subconverter" ]; then
            wget -O subconverter.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
            tar -zxvf subconverter.tar.gz -C ./
          fi
          chmod +x ./subconverter/subconverter && nohup ./subconverter/subconverter >./subconverter.log 2>&1 &
          python ./utils/sub_merge.py
      - name: GitMerge
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git pull origin master
          git add sub
          git add sub.yaml
          git commit -m "merge: $(date '+%Y-%m-%d %H:%M:%S') 合并节点"
      - name: Push
        uses: ad-m/github-push-action@master
        with:
          branch: master
      - name: GitCommit
        run: |
          git pull origin master
          git add list.json
          (git commit -m "update: $(date '+%Y-%m-%d %H:%M:%S') 更新链接") || true
      - name: GitPush
        uses: ad-m/github-push-action@master
        with:
          branch: master

  update_branch:
    needs: [auto_update]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: UpdateBranch
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git pull origin master
          git checkout --orphan latest_branch
          git add -A
          git commit -am "update: $(date '+%Y-%m-%d %H:%M:%S')"
          git branch -D master
          git branch -m master
          git push -f origin master
